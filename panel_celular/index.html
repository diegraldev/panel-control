<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Remote Control</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='18' y='20' width='64' height='44' rx='5' fill='none' stroke='%23000' stroke-width='6'/%3E%3Cpath d='M10 74h80l-6-10H16z' fill='%23000'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#fff; color:#000; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:28px 20px 48px; }
  .wrap { max-width:480px; margin:0 auto; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  h1 { font-size:20px; margin:0; font-weight:600; letter-spacing:-0.02em; }
  .status { font-size:12px; color:#888; }
  .server-battery { display:flex; align-items:center; gap:6px; font-size:11px; color:#aaa; margin-top:2px; }
  .battery-icon { width:22px; height:11px; border:1px solid #000; border-radius:2px; position:relative; padding:1px; box-sizing:border-box; }
  .battery-icon::after { content:''; position:absolute; right:-4px; top:3px; width:2px; height:5px; background:#000; border-radius:0 1px 1px 0; }
  .battery-fill { height:100%; background:#000; border-radius:1px; transition:width .4s; }
  .clock { font-size:12px; color:#aaa; margin-bottom:20px; }
  .info { font-size:13px; color:#888; line-height:1.7; margin:0 0 28px; }
  .info b { color:#000; font-weight:500; }
  .row { display:flex; align-items:baseline; justify-content:space-between; padding:14px 0; border-bottom:1px solid #e8e8e8; }
  .row:first-child { border-top:1px solid #e8e8e8; }
  .k { font-size:12px; color:#888; text-transform:uppercase; letter-spacing:.08em; }
  .k .sub { font-size:11px; color:#aaa; display:block; text-transform:none; letter-spacing:0; line-height:1.4; }
  .v { font-size:26px; font-weight:600; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; text-align:right; }
  .v small { font-size:13px; color:#888; font-weight:400; }
  .v.ram-detail { font-size:13px; font-weight:400; color:#888; text-align:left; line-height:1.4; }
  .section { font-size:11px; color:#aaa; text-transform:uppercase; letter-spacing:.1em; margin:28px 0 8px; }
  .buttons { display:flex; gap:10px; }
  button { flex:1; padding:16px; font-size:15px; font-weight:600; font-family:inherit; border-radius:10px; cursor:pointer; transition:opacity .15s; }
  button:active { opacity:.6; }
  .primary { background:#000; color:#fff; border:1px solid #000; }
  .secondary { background:#fff; color:#000; border:1px solid #000; }
  .msg { font-size:12px; color:#888; margin-top:18px; text-align:center; }
  .offline { text-align:center; padding:60px 0; }
  .offline .title { font-size:18px; font-weight:600; margin-bottom:8px; }
  .offline p { font-size:13px; color:#888; }
  .hidden { display:none !important; }
  .modal { position:fixed; inset:0; background:rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center; padding:24px; z-index:10; }
  .modal .box { background:#fff; border:1px solid #000; border-radius:14px; padding:26px; max-width:320px; width:100%; text-align:center; }
  .modal h2 { margin:0 0 10px; font-size:18px; }
  .modal p { color:#888; font-size:13px; line-height:1.6; margin:0 0 22px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Remote Control</h1><span class="status" id="status">…</span></header>
  <div class="server-battery">
    <span class="battery-icon"><div class="battery-fill" id="batteryFill"></div></span>
    <span id="batteryText">Server battery —</span>
  </div>
  <div class="clock" id="clock"></div>
  <div class="info" id="info"></div>

  <div id="content" class="hidden">
    <div class="row"><span class="k">RAM<span class="sub" id="ramDetail"></span></span><span class="v" id="ram">—</span></div>
    <div class="row"><span class="k">CPU</span><span class="v" id="cpu">—</span></div>
    <div id="gpus"></div>
    <div class="row"><span class="k">CPU Temp</span><span class="v" id="cputemp">—</span></div>
    <div class="row"><span class="k">NVIDIA GPU Temp</span><span class="v" id="nvidiatemp">—</span></div>

    <div class="section">T3 Code</div>
    <div class="buttons"><button class="secondary" id="t3btn" onclick="t3()">…</button></div>

    <div class="section">Power</div>
    <div class="buttons">
      <button class="secondary" id="shutdownBtn" onclick="confirmShutdown()">Shut down</button>
    </div>
  </div>

  <div id="pcOff" class="offline hidden">
    <div class="title">PC is off</div>
    <p>No connection to the PC.</p>
    <div class="buttons" style="margin-top:28px">
      <button class="primary" onclick="wake()">Wake up</button>
    </div>
  </div>

  <div class="msg" id="msg"></div>
</div>

<div class="modal hidden" id="modal">
  <div class="box" onclick="event.stopPropagation()">
    <h2>Shut down the PC?</h2>
    <p>This will power off the PC immediately.</p>
    <div class="buttons">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="shutdown()">Shut down</button>
    </div>
  </div>
</div>

<script>
const TIMEOUT = 15000; // if no status for 15s, consider the PC off
const modal = document.getElementById('modal');
modal.onclick = closeModal;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function refresh() {
  fetch('/status').then(r=>r.json()).then(d=>{
    const now = Date.now();
    const online = !!d.recibido_en_celular && (now - (d.recibido_ts || 0) * 1000) < TIMEOUT;
    const s = document.getElementById('status');
    s.textContent = online ? '● online' : '○ offline';
    document.getElementById('content').classList.toggle('hidden', !online);
    document.getElementById('pcOff').classList.toggle('hidden', online);
    if (!online) return;

    if (d.ram) {
      document.getElementById('ram').innerHTML = d.ram.percent + '<small>%</small>';
      document.getElementById('ramDetail').textContent = d.ram.used_mb + ' / ' + d.ram.total_mb + ' MB';
    }
    if (d.cpu_percent != null) document.getElementById('cpu').innerHTML = d.cpu_percent + '<small>%</small>';
    if (d.cpu_temp && d.cpu_temp.max != null) document.getElementById('cputemp').innerHTML = Math.round(d.cpu_temp.max) + '<small>°C</small>';

    let nvidiaTemp = '—';
    const list = (d.gpus || []).map(g => {
      if (g.type === 'nvidia') {
        if (g.temp != null) nvidiaTemp = Math.round(g.temp) + '<small>°C</small>';
        return `<div class="row"><span class="k">NVIDIA GPU<span class="sub">${g.name || ''}</span></span><span class="v">${g.usage != null ? Math.round(g.usage) + '<small>%</small>' : '—'}</span></div>`;
      }
      return `<div class="row"><span class="k">Intel GPU<span class="sub">${g.name || ''}</span></span><span class="v">${g.usage != null ? Math.round(g.usage) + '<small>%</small>' : '—'}</span></div>`;
    }).join('');
    document.getElementById('gpus').innerHTML = list;
    document.getElementById('nvidiatemp').innerHTML = nvidiaTemp;

    document.getElementById('info').innerHTML =
      '<b>' + (d.hostname||'?') + '</b> · ' + (d.ip||'?');

    const t = document.getElementById('t3btn');
    t.textContent = d.t3_open ? 'Close T3 Code' : 'Open T3 Code';
    t.dataset.action = d.t3_open ? 't3-close' : 't3-open';
  }).catch(()=>{
    document.getElementById('status').textContent = '○ offline';
    document.getElementById('content').classList.add('hidden');
    document.getElementById('pcOff').classList.remove('hidden');
  });
}

function cmd(c, m) {
  document.getElementById('msg').textContent = m;
  fetch('/cmd', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({comando:c, ts:Date.now()}) })
  .then(r=>r.json()).then(()=>document.getElementById('msg').textContent='✓ '+m)
  .catch(e=>document.getElementById('msg').textContent='Error: '+e);
}
function wake() { cmd('wake', 'Sending magic packet…'); }
function confirmShutdown() { modal.classList.remove('hidden'); }
function closeModal() { modal.classList.add('hidden'); }
function shutdown() { closeModal(); cmd('shutdown', 'Shutting down in 8s…'); }
function t3() { const b=document.getElementById('t3btn'); cmd(b.dataset.action, b.dataset.action==='t3-open'?'Opening T3 Code…':'Closing T3 Code…'); }

function refreshBattery() {
  fetch('/battery').then(r=>r.json()).then(b=>{
    if (b.level == null) return;
    document.getElementById('batteryFill').style.width = b.level + '%';
    document.getElementById('batteryText').textContent =
      'Server battery ' + b.level + '%' + (b.charging ? ' ⚡' : '');
  }).catch(()=>{});
}

setInterval(()=>{ document.getElementById('clock').textContent = new Date().toLocaleString(); refresh(); refreshBattery(); }, 2000);
refresh(); refreshBattery();
</script>
</body>
</html>
